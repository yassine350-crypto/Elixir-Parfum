<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elixir Parfum – Marrakech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--noir:#050505;--noir2:#121110;--or:#d4af6a;--or-clair:#f0d9a0;--or-fonce:#9c7a3c;--texte:#eee6d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;background:var(--noir)}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a2113 0,var(--noir) 60%);color:var(--texte);font-family:Jost,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:40px 24px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:168px;height:168px;border-radius:50%;border:2px solid var(--or);box-shadow:0 0 0 6px var(--noir),0 0 0 7px var(--or-fonce),0 12px 40px rgba(212,175,106,.18)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:2.6rem;letter-spacing:.02em;margin-top:28px;background:linear-gradient(180deg,var(--or-clair),var(--or) 55%,var(--or-fonce));-webkit-background-clip:text;background-clip:text;color:transparent}
.lieu{margin-top:6px;color:var(--or);font-size:1rem;display:flex;align-items:center;gap:6px}
.btns{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;text-decoration:none;font-size:1.05rem;font-weight:500;border:1px solid var(--or-fonce);background:var(--noir2);color:var(--texte);transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#1c1913}
.btn:focus-visible{outline:2px solid var(--or-clair);outline-offset:3px}
.btn svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;font-size:.82rem;font-weight:400;color:#b5aa94;margin-top:2px}
.btn.principal{background:linear-gradient(135deg,var(--or-clair),var(--or) 50%,var(--or-fonce));color:#120d03;border-color:transparent}
.btn.principal small{color:#3b2c0d}
.btn.principal:hover{filter:brightness(1.07)}
footer{margin-top:40px;font-size:.85rem;color:#8d8472}
</style></head>
